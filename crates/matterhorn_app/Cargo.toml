[package]
name = "matterhorn_app"
description = "Matterhorn Browser — Web3-native browser built on GPUI"
edition.workspace = true
version = "0.1.0"
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[[bin]]
name = "matterhorn_app"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
matterhorn_common.workspace = true
matterhorn_viewport.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
env_logger.workspace = true
log.workspace = true
